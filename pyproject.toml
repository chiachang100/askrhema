[project]
name = "askrhema"
version = "1.0.8"
description = "AskRhema - Conversational Bible search and AI exegesis assistant"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "AskRhema Team", email = "askrhema@example.com"}
]
license = "MIT OR Apache-2.0"   # simple SPDX string, not a table
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Religion",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Religion",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "streamlit==1.60.0",
    "qdrant-client>=1.16,<2",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "torch>=2.3.0",
    "torchvision>=0.15.0",
    "transformers>=4.41.0",
    "tokenizers>=0.19.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers -v"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["."]

[tool.black]
line-length = 80
target-version = ['py314']

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D107", "D203", "D212", "E501"]
exclude = [".git", ".venv", "__pycache__", "*.pyc","build", "dist", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "i18n"]

[tool.mypy]
python_version = "3.14"
exclude = ["tests/", "data/", ".venv/"]

strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true
