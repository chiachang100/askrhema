# pyproject.toml (add these sections)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuixiu-bible-search"
version = "0.2.0"
description = "TBS (Tuixiu Bible Search) - A hybrid, local-first Bible search and exegesis tool"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "TBS Team", email = "tbs@example.com"}
]
license = {text = "MIT OR Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Religion",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "streamlit>=1.40.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "google-genai>=0.1.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "tokenizers>=0.13.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["engine"]
exclude = [
    "tests",
    "data",
    "*.pyc",
    "__pycache__",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "*.pyc",
    "__pycache__",
    ".git",
    ".github",
    ".vscode",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers -v"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Add this to include the project root in PYTHONPATH
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ['py314']

[tool.ruff]
line-length = 100
target-version = "py314"
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["D100", "D104", "D107", "D203", "D212", "E501"]
exclude = [".git", ".venv", "__pycache__", "build", "dist", "tests"]

[tool.ruff.isort]
known-first-party = ["engine"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
explicit_package_bases = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
